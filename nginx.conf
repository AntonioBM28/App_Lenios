server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Comprimir respuestas de texto (JS/CSS/HTML) para acelerar la carga
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA (React Router): cualquier ruta que no exista como archivo cae a
    # index.html para que react-router-dom resuelva el path en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets versionados por Vite (hash en el nombre)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cachear index.html: siempre debe traer la última versión del bundle
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
